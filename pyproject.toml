[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-doc-pipeline"
version = "0.4.0"
description = "Markdown → PDF/DOCX document pipeline with cascading config and sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["markdown", "pdf", "docx", "document", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.5",
    "weasyprint>=68.0,<71",
    "python-docx>=1.1.2",
    "markdown>=3.5",
    "click>=8.1",
    "markitdown[pdf,docx]>=0.1.0",
    "python-pptx>=1.0",
    "pymdown-extensions>=10.0",
    "ziamath>=0.13",
    "latex2mathml>=3.78",
    "mathml2omml>=0.0.2",
]

[project.optional-dependencies]
azure = ["azure-storage-file-share>=12.0"]
s3 = ["boto3>=1.34"]
# Rasterizes Mermaid diagrams to PNG for embedding in .docx/.dotx output so
# Word documents show diagrams (not source) like the PDF builder does.
mermaid = ["cairosvg>=2.7"]

[project.urls]
Homepage = "https://github.com/gregshallardau/md-doc-pipeline"
Documentation = "https://github.com/gregshallardau/md-doc-pipeline/tree/master/docs"
Changelog = "https://github.com/gregshallardau/md-doc-pipeline/blob/master/CHANGELOG.md"
Issues = "https://github.com/gregshallardau/md-doc-pipeline/issues"

[project.scripts]
md-doc = "md_doc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["md_doc"]

# The source archive carries the package, its tests, docs, examples and prompts, but not the
# optional editors (they are separate packages with vendored front-end assets).
[tool.hatch.build.targets.sdist]
include = [
  "/md_doc",
  "/tests",
  "/docs",
  "/examples",
  "/prompts",
  "/tools",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/_theme.css",
]

[dependency-groups]
parity = ["numpy>=2.0", "pdfplumber>=0.11", "pypdfium2>=4.30", "pillow>=10.0"]
editor = ["md-doc-web-editor", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "cairosvg>=2.7",
    "types-pyyaml>=6.0.12.20260408",
    "types-markdown>=3.10.2.20260408",
]

[tool.uv.sources]
md-doc-web-editor = { path = "md-doc-web-editor", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=md_doc --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The Office builders lean heavily on the int-based python-docx/python-pptx
# geometry APIs (Length subclasses), so they're not fully typed yet; everything
# else (including the sync backends) is type-checked and gating in CI.
exclude = [
    "md_doc/builders/docx\\.py",
    "md_doc/builders/dotx\\.py",
    "md_doc/builders/pptx\\.py",
]
