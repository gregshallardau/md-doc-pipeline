[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-doc-web-editor"
version = "0.1.0"
description = "Self-contained browser editor for md-doc-pipeline workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "md-doc-pipeline>=0.3.0",
]

[project.scripts]
md-doc-edit = "md_doc_web_editor.cli:main"

[tool.setuptools.packages.find]
include = ["md_doc_web_editor*"]

[tool.setuptools.package-data]
md_doc_web_editor = ["static/*", "static/**/*"]

[tool.uv.sources]
md-doc-pipeline = { path = "..", editable = true }
