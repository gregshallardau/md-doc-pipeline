name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system libraries (WeasyPrint + cairosvg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libcairo2 libffi-dev shared-mime-info

      - name: Install dependencies
        run: uv sync --group dev --group editor

      - name: Lint — ruff
        run: uv run --group editor ruff check .

      - name: Lint — black
        run: uv run --group editor black --check .

      - name: Type check — mypy
        run: uv run --group editor mypy md_doc/

      - name: Test — pytest (with coverage gate)
        run: uv run --group editor pytest tests/ md-doc-web-editor/tests/ --tb=short

  nvim:
    name: Neovim plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Test plugin
        run: nvim --headless -u NONE -c "lua dofile('nvim-plugin/tests/run.lua')" +qa!

  editor-clients:
    name: Browser and PHP editor regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PHP syntax and service regressions
        run: |
          find filament-md-doc/src -name '*.php' -exec php -l {} \;
          php filament-md-doc/tests/regression.php
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser interaction and sandbox regressions
        run: node tests/browser/editor.cjs
      - uses: astral-sh/setup-uv@v7
      - name: Install local editor for offline browser checks
        run: uv sync --group editor
      - name: Offline editor with bundled Monaco and blocked external requests
        run: node tests/browser/offline.cjs

  export-parity:
    name: Rendered Word/PDF parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install office renderer and fixed fixture fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0
      - name: Install locked test dependencies
        run: uv sync --frozen --python 3.12 --group dev --group parity
      - name: Compare actual rendered exports
        env:
          MD_DOC_PARITY: "1"
          MD_DOC_PARITY_ARTIFACTS: parity-artifacts
        run: uv run --frozen --group parity pytest tests/parity --no-cov --tb=short
      - name: Retain exports, measurements and visual differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-pdf-parity
          path: parity-artifacts/
          if-no-files-found: error

  package:
    name: Build & install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Install the wheel into a clean venv and run the CLI
        run: |
          python3.12 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/md-doc --version
          # doctor may warn about optional extras / system libs; that's fine here.
          /tmp/smoke/bin/md-doc doctor || true
      - name: Build & install editor wheel and test real server startup
        run: |
          uv build --directory md-doc-web-editor --out-dir /tmp/editor-dist
          /tmp/smoke/bin/pip install /tmp/editor-dist/*.whl
          /tmp/smoke/bin/python md-doc-web-editor/tests/smoke_installed.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: pip-audit
        # Non-blocking for now — advisories in transitive deps shouldn't red the
        # build. Drop the `|| true` to make it gating once the baseline is clean.
        run: uvx pip-audit || true
